<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Highlight Manager</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, #3a2413 0%, #121212 45%, #0d0b0a 100%);
      color: #f5efe8;
    }
    header {
      padding: 24px 32px;
      background: rgba(16, 12, 10, 0.95);
      color: #f7f1e8;
      border-bottom: 1px solid rgba(255, 116, 0, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 12px;
      vertical-align: middle;
      letter-spacing: 0.3px;
    }
    .mode-badge.off {
      background: rgba(255, 116, 0, 0.14);
      color: #ffb066;
      border: 1px solid rgba(255, 116, 0, 0.45);
    }
    .mode-badge.on {
      background: rgba(72, 187, 120, 0.14);
      color: #7ee3a8;
      border: 1px solid rgba(72, 187, 120, 0.45);
    }
    .mode-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }
    main {
      padding: 24px 32px 40px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .panel {
      background: rgba(23, 17, 14, 0.92);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
      border: 1px solid rgba(255, 116, 0, 0.08);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .trend-card {
      background: rgba(18, 13, 10, 0.8);
      border-radius: 14px;
      padding: 12px 16px;
      border: 1px solid rgba(255, 116, 0, 0.2);
      min-width: 240px;
      flex: 0 0 auto;
    }
    .trend-card canvas {
      display: block;
      width: 240px;
      height: 80px;
    }
    .row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .row input[type="number"] {
      width: 120px;
    }
    button {
      background: linear-gradient(135deg, #ff8a1d, #ff6a00);
      color: #1b0f07;
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 10px 18px rgba(255, 106, 0, 0.25);
    }
    button.secondary {
      background: #2b2018;
      color: #f5efe8;
      border: 1px solid rgba(255, 116, 0, 0.2);
      box-shadow: none;
    }
    .status {
      font-weight: 600;
      margin-top: 8px;
    }
    .clip-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .clip-card {
      background: rgba(26, 19, 15, 0.95);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      position: relative;
      border: 1px solid rgba(255, 116, 0, 0.08);
    }
    .clip-card video {
      width: 100%;
      border-radius: 10px;
      background: #000;
    }
    .clip-index {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #FF7400;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      z-index: 2;
    }
    .clip-feature {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #ffb37c;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      z-index: 2;
    }
    .event-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255, 180, 50, 0.2);
      color: #ffd27a;
      border: 1px solid rgba(255, 180, 50, 0.4);
      margin-top: 6px;
    }
    .event-badge.none {
      background: rgba(120, 120, 120, 0.1);
      color: #8a7c70;
      border-color: rgba(120, 120, 120, 0.2);
    }
    .event-badge .type-chip {
      margin-left: 4px;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      background: rgba(255, 106, 0, 0.35);
      color: #fff1d9;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    button.event-btn {
      background: linear-gradient(135deg, #ffd27a, #ffae3d);
      color: #1b0f07;
    }
    select.event-type-select {
      background: #2b2018;
      color: #f5efe8;
      border: 1px solid rgba(255, 180, 50, 0.4);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 600;
      cursor: pointer;
    }
    select.event-type-select:focus {
      outline: 2px solid rgba(255, 180, 50, 0.6);
    }
    .clip-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .badge {
      display: inline-flex;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      background: rgba(255, 116, 0, 0.18);
      color: #ffb37c;
      border: 1px solid rgba(255, 116, 0, 0.25);
    }
    .muted {
      color: #c9b7a7;
      font-size: 14px;
    }
    /* 모달 스타일 */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: #1c1c1c;
      border-radius: 16px;
      padding: 24px;
      width: min(1000px, 95vw);
      max-height: 95vh;
      overflow-y: auto;
      border: 1px solid rgba(255, 116, 0, 0.2);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    /* 타임라인 스타일 */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 16px;
    }
    .timeline-strip {
      position: relative;
      background: #000;
      border-radius: 12px;
      height: 80px;
      cursor: pointer;
      border: 1px solid #333;
      overflow: hidden;
    }
    .thumbnail-strip {
      display: flex;
      height: 100%;
      pointer-events: none;
    }
    .thumbnail-strip img {
      height: 100%;
      flex: 1;
      object-fit: cover;
      opacity: 0.5;
    }
    .trim-selection {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(255, 116, 0, 0.2);
      border-left: 2px solid #FF7400;
      border-right: 2px solid #FF7400;
      pointer-events: none;
      z-index: 5;
    }
    .trim-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 12px;
      background: #FF7400;
      cursor: ew-resize;
      z-index: 10;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #fff;
      pointer-events: none;
      z-index: 15;
    }
    .tab-row {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .tab-btn {
      background: #2b2018;
      color: #f5efe8;
      border: 1px solid rgba(255, 116, 0, 0.2);
      box-shadow: none;
      border-radius: 999px;
      padding: 7px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #ff8a1d, #ff6a00);
      color: #1b0f07;
      border-color: transparent;
      box-shadow: 0 6px 14px rgba(255, 106, 0, 0.25);
    }
    .source-badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-left: 4px;
      vertical-align: middle;
    }
    .source-badge.log {
      background: rgba(72, 187, 120, 0.18);
      color: #7ee3a8;
      border: 1px solid rgba(72, 187, 120, 0.4);
    }
    .source-badge.ai {
      background: rgba(255, 116, 0, 0.14);
      color: #ffb066;
      border: 1px solid rgba(255, 116, 0, 0.35);
    }
    .order-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(26, 19, 15, 0.95);
      border: 1px solid rgba(255, 116, 0, 0.15);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: grab;
      user-select: none;
      transition: border-color 0.15s, background 0.15s;
    }
    .order-item:hover { border-color: rgba(255, 116, 0, 0.4); }
    .order-item.drag-over { border-color: #ff8a1d; background: rgba(255, 116, 0, 0.08); }
    .order-item.dragging { opacity: 0.4; }
    .drag-handle { color: #8a7c70; font-size: 18px; cursor: grab; }
    .order-num { color: #ff8a1d; font-weight: 700; font-size: 13px; min-width: 20px; text-align: right; }
    .shap-chart-mini { display: block; width: 100%; height: 80px; margin-top: 8px; border-radius: 6px; background: rgba(0,0,0,0.25); }
    .shap-chart-full { display: block; width: 100%; height: 200px; border-radius: 8px; background: rgba(0,0,0,0.3); margin-top: 10px; }
    .shap-legend { display: flex; gap: 14px; margin-top: 6px; font-size: 11px; color: #8a7c70; }
    .shap-legend span { display: flex; align-items: center; gap: 4px; }
    .shap-legend .dot-pos { width: 10px; height: 10px; border-radius: 2px; background: #ff8a1d; }
    .shap-legend .dot-neg { width: 10px; height: 10px; border-radius: 2px; background: #6ab4f5; }
  </style>
</head>
<body>
  <header>
    <h1>AI Highlight Manager<span id="modeBadge" class="mode-badge off" title="서버 시작 시점의 XGB 모드"><span class="dot"></span><span id="modeBadgeText">모드 확인 중...</span></span></h1>
    <p class="muted">경기 영상을 업로드하면 하이라이트 후보 클립을 생성하고 웹에서 선택/삭제 관리할 수 있습니다.</p>
  </header>
  <main>
    <section class="panel">
      <div class="panel-header">
        <h2>영상 업로드</h2>
        <div class="trend-card">
          <div class="muted" style="margin-bottom: 6px;">XH Score Trend</div>
          <canvas id="scoreTrend" width="240" height="80"></canvas>
        </div>
      </div>

      <!-- 모드 탭 -->
      <div class="tab-row">
        <button class="tab-btn active" id="tabAI" onclick="switchTab('ai')">AI 탐지</button>
        <button class="tab-btn" id="tabLog" onclick="switchTab('log')">로그 + AI</button>
        <button class="tab-btn" id="tabTag" onclick="switchTab('tag')">이벤트 태깅</button>
      </div>

      <!-- AI 탐지 폼 -->
      <div id="panelAI">
        <div class="row">
          <input type="file" id="videoInput" accept="video/*" />
          <label>후보 수 <input type="number" id="countInput" min="10" max="40" value="40" /></label>
          <button id="uploadBtn">분석 시작</button>
          <button id="resetBtn" class="secondary">초기화</button>
        </div>
      </div>

      <!-- 로그 + AI 폼 -->
      <div id="panelLog" style="display:none;">
        <div class="row" style="align-items: flex-start; flex-wrap: wrap; gap: 16px;">
          <div style="display:flex; flex-direction:column; gap:8px; flex:1; min-width:220px;">
            <label class="muted">경기 영상</label>
            <input type="file" id="logVideoInput" accept="video/*" />
          </div>
          <div style="display:flex; flex-direction:column; gap:8px; flex:2; min-width:300px;">
            <label class="muted">타임라인 로그 (.json 파일)</label>
            <input type="file" id="logDataInput" accept=".json,application/json" />
            <span class="muted" id="logFileInfo" style="font-size:12px;"></span>
          </div>
        </div>
        <div class="row" style="margin-top:12px; flex-wrap:wrap; gap:16px;">
          <label class="muted" style="display:flex; align-items:center; gap:8px;">
            후반 시작 (영상 내 시각)
            <input type="number" id="halfStartMin" min="0" max="120" value="25" style="width:70px;" /> 분
            <input type="number" id="halfStartSec" min="0" max="59" value="0" style="width:60px;" /> 초
          </label>
          <label class="muted">후보 수 <input type="number" id="logCountInput" min="10" max="40" value="40" /></label>
          <button id="logUploadBtn">로그 분석 시작</button>
          <button id="logResetBtn" class="secondary">초기화</button>
        </div>
      </div>

      <!-- 이벤트 태깅 패널 -->
      <div id="panelTag" style="display:none;">
        <div style="display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start;">
          <!-- 좌: 영상 -->
          <div style="flex:1; min-width:280px;">
            <div class="row" style="gap:8px; margin-bottom:10px;">
              <select id="tagJobSelect" class="event-type-select" style="flex:1; min-width:0;"></select>
              <button id="tagLoadBtn" class="secondary">영상 불러오기</button>
            </div>
            <video id="tagVideo" controls style="width:100%; border-radius:10px; background:#000; display:none;"></video>
            <div class="muted" id="tagVideoInfo" style="font-size:11px; margin-top:4px;"></div>
          </div>
          <!-- 우: 태깅 컨트롤 -->
          <div style="flex:0 0 200px;">
            <div class="muted" style="font-size:11px; margin-bottom:4px;">현재 재생 위치</div>
            <div id="tagCurrentTime" style="font-size:32px; font-weight:700; color:#ff8a1d; font-variant-numeric:tabular-nums; letter-spacing:1px;">0:00.0</div>
            <div class="muted" id="tagFrameInfo" style="font-size:11px; margin-bottom:14px;">frame 0</div>
            <label class="muted" style="font-size:12px;">이벤트 타입</label>
            <select id="tagEventType" class="event-type-select" style="width:100%; margin-top:4px; margin-bottom:10px;"></select>
            <button id="tagMarkBtn" style="width:100%;" disabled>⚑ 현재 시점 태그</button>
          </div>
        </div>
        <!-- 태그 목록 -->
        <div id="tagMarkListWrap" style="display:none; margin-top:16px; padding-top:14px; border-top:1px solid rgba(255,116,0,0.1);">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span style="font-size:13px; font-weight:600;">태그 목록</span>
            <span class="badge" id="tagMarkCount">0개</span>
          </div>
          <div id="tagMarkList" style="display:flex; flex-direction:column; gap:6px; max-height:260px; overflow-y:auto;"></div>
        </div>
      </div>

      <!-- 공통: 기존 Run 불러오기 -->
      <div class="row" style="margin-top: 10px; gap: 8px; flex-wrap: wrap;">
        <label class="muted" style="display:flex; align-items:center; gap:6px;">
          기존 Run 불러오기
          <select id="existingJobSelect" class="event-type-select" style="min-width: 320px;">
            <option value="">(선택)</option>
          </select>
        </label>
        <button id="loadJobBtn" class="secondary">불러오기</button>
        <button id="refreshJobsBtn" class="secondary">목록 새로고침</button>
      </div>
      <div class="status" id="status">대기 중</div>
      <div class="muted" id="jobInfo"></div>
    </section>

    <section class="panel">
      <div class="row" style="justify-content: space-between;">
        <h2>하이라이트 후보</h2>
        <div class="row">
          <label class="muted" style="display:flex; align-items:center; gap:6px;">
            필터
            <select id="categoryFilter" class="event-type-select">
              <option value="all">전체</option>
              <option value="Good">Good 만</option>
              <option value="Bad">Bad 만</option>
              <option value="clips">미분류</option>
              <option value="missing">파일 없음</option>
            </select>
          </label>
          <span class="badge" id="selectedCount">선택 0개</span>
          <button id="mergeBtn">선택 클립 합치기</button>
          <button id="exportBtn" class="secondary">선택 클립 따로 저장</button>
        </div>
      </div>
      <div class="muted" id="mergeInfo"></div>
      <div class="muted" id="exportInfo"></div>
      <div class="clip-grid" id="clipGrid"></div>

      <!-- 합치기 순서 패널 -->
      <div id="orderPanel" style="display:none; margin-top:20px; padding-top:16px; border-top:1px solid rgba(255,116,0,0.1);">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
          <h3 style="margin:0; font-size:15px; color:#f5efe8;">합치기 순서</h3>
          <span class="muted" style="font-size:12px;">드래그로 순서 변경 → 이 순서대로 합쳐집니다</span>
        </div>
        <div id="orderList" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>
    </section>
  </main>

  <div class="modal" id="trimModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>클립 컷 편집</h2>
        <button class="secondary" id="closeTrim">닫기</button>
      </div>
      <video id="trimVideo" controls style="width: 100%; border-radius: 12px; background: #000;"></video>
      <div class="timeline">
        <div class="timeline-strip" id="trimTimeline">
          <div class="thumbnail-strip" id="trimThumbs"></div>
          <div class="trim-selection" id="trimSelection"></div>
          <div id="trimHandleStart" class="trim-handle"></div>
          <div id="trimHandleEnd" class="trim-handle"></div>
          <div class="playhead" id="trimPlayhead"></div>
        </div>
        <div class="row" style="justify-content: space-between;">
          <span class="muted" id="trimCurrentTime">현재: 0.0s</span>
          <span class="muted" id="trimRangeInfo">범위: 0.0s ~ 0.0s</span>
        </div>
        <div class="row" style="justify-content: flex-end; gap: 10px; flex-wrap: wrap;">
          <button id="loopToggle" class="secondary">구간 루프: OFF</button>
          <label class="muted" style="display:flex; align-items:center; gap:6px;">
            타입
            <select id="eventTypeSelect" class="event-type-select"></select>
          </label>
          <button id="markEventBtn" class="event-btn">⚑ 이벤트 프레임 지정 (현재 시점)</button>
          <button id="clearEventBtn" class="secondary">이벤트 지정 해제</button>
          <button id="applyTrim">선택 구간 저장</button>
        </div>
        <div class="muted" id="currentEventInfo"></div>
        <div id="shapChartArea" style="display:none;">
          <div style="font-size:12px; color:#8a7c70; margin-top:12px; margin-bottom:2px;">왜 하이라이트로 뽑혔나 (Shapley 기여도)</div>
          <canvas id="shapChartFull" class="shap-chart-full"></canvas>
          <div class="shap-legend">
            <span><span class="dot-pos"></span> 하이라이트 가능성 ↑</span>
            <span><span class="dot-neg"></span> 하이라이트 가능성 ↓</span>
          </div>
        </div>
        <div class="muted" id="trimModalInfo"></div>
      </div>
    </div>
  </div>

  <script>
    // ── 탭 전환 ──────────────────────────────────
    function switchTab(mode) {
      document.getElementById('panelAI').style.display  = mode === 'ai'  ? '' : 'none';
      document.getElementById('panelLog').style.display = mode === 'log' ? '' : 'none';
      document.getElementById('panelTag').style.display = mode === 'tag' ? '' : 'none';
      document.getElementById('tabAI').classList.toggle('active', mode === 'ai');
      document.getElementById('tabLog').classList.toggle('active', mode === 'log');
      document.getElementById('tabTag').classList.toggle('active', mode === 'tag');
      if (mode === 'tag') loadTagJobs();
    }

    // ── 상수 및 변수 ──────────────────────────────
    const uploadBtn = document.getElementById('uploadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const videoInput = document.getElementById('videoInput');
    const countInput = document.getElementById('countInput');
    const statusEl = document.getElementById('status');
    const modeBadge = document.getElementById('modeBadge');
    const modeBadgeText = document.getElementById('modeBadgeText');
    fetch('/api/mode').then(r => r.json()).then(data => {
      const on = !!data.use_xgb;
      modeBadge.classList.toggle('on', on);
      modeBadge.classList.toggle('off', !on);
      modeBadgeText.textContent = on ? 'XGB ON · 실사용 모드' : 'XGB OFF · 학습 데이터 수집 모드';
      modeBadge.title = on

    // ── Shapley 바 차트 렌더링 ────────────────────────
    // stats: {featureKey: value} (양수=기여, 음수=감점)
    // compact: true면 상위 5개만, false면 전체
    function drawShapChart(canvas, stats, compact = false) {
      if (!canvas || !stats) return;
      const ctx = canvas.getContext('2d');
      const W = canvas.offsetWidth || canvas.width;
      const H = canvas.offsetHeight || canvas.height;
      canvas.width = W;
      canvas.height = H;
      ctx.clearRect(0, 0, W, H);

      const entries = Object.entries(stats)
        .map(([k, v]) => ({ key: k, val: v }))
        .sort((a, b) => Math.abs(b.val) - Math.abs(a.val));

      const shown = compact ? entries.slice(0, 5) : entries;
      if (!shown.length) return;

      const maxAbs = Math.max(...shown.map(e => Math.abs(e.val)), 1e-9);
      const rowH = Math.floor(H / shown.length);
      const labelW = compact ? 88 : 140;
      const barAreaW = W - labelW - 8;
      const midX = labelW + barAreaW * 0.5;

      ctx.font = `${compact ? 10 : 12}px "Pretendard", system-ui, sans-serif`;

      shown.forEach((e, i) => {
        const y = i * rowH;
        const barLen = (Math.abs(e.val) / maxAbs) * (barAreaW * 0.45);
        const isPos = e.val >= 0;
        const label = FEATURE_LABELS[e.key] || e.key;
        const pct = (e.val * 100).toFixed(1);

        // 라벨
        ctx.fillStyle = '#c9b7a7';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, labelW - 4, y + rowH * 0.5);

        // 바
        const barX = isPos ? midX : midX - barLen;
        const barY = y + rowH * 0.2;
        const barH = rowH * 0.6;
        ctx.fillStyle = isPos ? '#ff8a1d' : '#6ab4f5';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(barX, barY, barLen, barH, 2) : ctx.rect(barX, barY, barLen, barH);
        ctx.fill();

        // 중심선
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(midX, y);
        ctx.lineTo(midX, y + rowH);
        ctx.stroke();

        // 수치
        if (!compact) {
          ctx.fillStyle = isPos ? '#ffb37c' : '#90c8f8';
          ctx.textAlign = isPos ? 'left' : 'right';
          ctx.fillText(`${isPos ? '+' : ''}${pct}%`, isPos ? midX + barLen + 3 : midX - barLen - 3, y + rowH * 0.5);
        }
      });
    }

    // --- xH 스코어 그래프 로직 복구 ---
    async function loadScoreTrend(jobId, highlightFrames = []) {
      try {
        // [수정] 메타데이터에서 서버가 알려준 정확한 CSV 파일명을 가져옴
        const jobRes = await fetch(`/api/jobs/${jobId}`);
        const jobData = await jobRes.json();
        const scoreFileName = jobData.score_file || 'xh_scores.csv';

        let res = await fetch(`/runs/${jobId}/${scoreFileName}`);
        if (!res.ok) res = await fetch(`/runs/${jobId}/clips/${scoreFileName}`);
        if (!res.ok) return;

        const text = await res.text();
        const lines = text.trim().split('\n');
        if (lines.length < 2 || !scoreCtx) return;
        const headers = lines[0].split(',');
        const frameIdx = headers.indexOf('frame');
        const scoreIdx = headers.indexOf('smoothed_score');
        if (frameIdx === -1 || scoreIdx === -1) return;

        const frames = [];
        const scores = [];
        lines.slice(1).forEach(line => {
          const parts = line.split(',');
          const frame = parseFloat(parts[frameIdx]);
          const score = parseFloat(parts[scoreIdx]);
          if (!isNaN(frame) && !isNaN(score)) {
            frames.push(frame);
            scores.push(score);
          }
        });

        if (!scores.length) return;
        const maxScore = Math.max(...scores), minScore = Math.min(...scores);
        const range = maxScore - minScore || 1;

        scoreCtx.clearRect(0, 0, scoreTrend.width, scoreTrend.height);
        scoreCtx.strokeStyle = '#ff9a3d';
        scoreCtx.lineWidth = 2;
        scoreCtx.beginPath();
        scores.forEach((value, idx) => {
          const x = (idx / (scores.length - 1)) * scoreTrend.width;
          const y = scoreTrend.height - ((value - minScore) / range) * scoreTrend.height;
          idx === 0 ? scoreCtx.moveTo(x, y) : scoreCtx.lineTo(x, y);
        });
        scoreCtx.stroke();

        if (highlightFrames.length && frames.length) {
          scoreCtx.fillStyle = '#ff6a00';
          highlightFrames.forEach(frame => {
            let idx = frames.findIndex(f => f >= frame);
            if (idx === -1) idx = frames.length - 1;
            const x = (idx / (scores.length - 1)) * scoreTrend.width;
            const y = scoreTrend.height - ((scores[idx] - minScore) / range) * scoreTrend.height;
            scoreCtx.beginPath();
            scoreCtx.arc(x, y, 3, 0, Math.PI * 2);
            scoreCtx.fill();
          });
        }
      } catch (err) { console.warn('Trend load failed', err); }
    }

    // --- 썸네일 추출 로직 수정 ---
    async function generateThumbnails() {
      trimThumbs.innerHTML = '';
      const duration = trimVideo.duration;
      if (!duration) return;

      const count = 10;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 160; canvas.height = 90;

      // 현재 비디오의 시간을 백업
      const originalTime = trimVideo.currentTime;

      for (let i = 0; i < count; i++) {
        const time = (duration / (count - 1)) * i;
        await new Promise(resolve => {
          trimVideo.currentTime = time;
          trimVideo.addEventListener('seeked', () => {
            ctx.drawImage(trimVideo, 0, 0, canvas.width, canvas.height);
            const img = document.createElement('img');
            img.src = canvas.toDataURL('image/jpeg', 0.7);
            trimThumbs.appendChild(img);
            resolve();
          }, { once: true });
        });
      }
      // 원래 시간으로 복구
      trimVideo.currentTime = originalTime;
    }

    // --- 클립 렌더링 및 편집 모달 ---
    let lastMetadata = null;

    function renderClips(metadata) {
      lastMetadata = metadata;
      clipGrid.innerHTML = '';
      currentJobId = metadata.job_id;
      const { clips = [], selected = {}, trimmed = {}, clip_features = {}, clip_feature_stats = {}, event_marks = {}, clip_categories = {}, clip_scores = {}, clip_timestamps = {}, job_id } = metadata;
      const filterVal = categoryFilter ? categoryFilter.value : 'all';

      // 스코어 기반 순위 계산
      const scoreRanks = {};
      if (Object.keys(clip_scores).length > 0) {
        [...clips].sort((a, b) => (clip_scores[b] || 0) - (clip_scores[a] || 0))
                  .forEach((clip, i) => { scoreRanks[clip] = i + 1; });
      }

      const visibleClips = clips.filter(clip => {
        if (filterVal === 'all') return true;
        return (clip_categories[clip] || 'missing') === filterVal;
      });

      visibleClips.forEach((clip, idx) => {
        const card = document.createElement('div');
        card.className = 'clip-card';
        const evMark = event_marks[clip];
        let evBadge;
        if (evMark) {
          const typeKey = evMark.event_type || 'unknown';
          const typeLabel = EVENT_TYPE_LABELS[typeKey] || typeKey;
          evBadge = `<div class="event-badge">⚑ 이벤트 ${evMark.event_time_in_clip_sec.toFixed(1)}s (frame ${evMark.event_frame_original})<span class="type-chip">${typeLabel}</span></div>`;
        } else {
          evBadge = `<div class="event-badge none">⚑ 이벤트 미지정</div>`;
        }

        // 카테고리 배지 (Good / Bad / missing)
        const cat = clip_categories[clip] || '';
        const catColor = cat === 'Good' ? '#2e7d32'
                       : cat === 'Bad' ? '#c62828'
                       : cat === 'clips' ? '#616161'
                       : '#999';
        const catLabel = cat === 'Good' ? '✓ Good'
                       : cat === 'Bad' ? '✗ Bad'
                       : cat === 'clips' ? '미분류'
                       : '파일 없음';
        const catBadge = `<div style="position:absolute; top:8px; right:8px; background:${catColor}; color:#fff; padding:2px 8px; border-radius:10px; font-size:12px; font-weight:600;">${catLabel}</div>`;

        const videoSrc = `/api/jobs/${job_id}/clips/${clip}/file`;
        card.style.position = 'relative';
        // Good/Bad 버튼 활성화 표시
        const goodActive = cat === 'Good' ? 'background:#2e7d32; color:#fff;' : '';
        const badActive = cat === 'Bad' ? 'background:#c62828; color:#fff;' : '';

        const rankNum = scoreRanks[clip];
        const scoreVal = clip_scores[clip];
        const rankLabel = rankNum ? `${rankNum}위` : `#${idx + 1}`;
        const scoreLabel = scoreVal !== undefined ? ` · ${(scoreVal * 100).toFixed(1)}` : '';

        const ts = clip_timestamps[clip];
        const tsLabel = ts ? `⏱ ${fmtTime(ts.start)} ~ ${fmtTime(ts.end)}` : '';

        const topFeatureKey = clip_features[clip] || '';
        const topFeatureLabel = FEATURE_LABELS[topFeatureKey] || topFeatureKey || 'N/A';
        card.innerHTML = `
          ${catBadge}
          <div class="clip-index" title="스코어 순위">${rankLabel}${scoreLabel}</div>
          <div class="clip-feature" title="${topFeatureKey}">${topFeatureLabel}</div>
          <video controls src="${videoSrc}"></video>
          ${tsLabel ? `<div style="font-size:11px; color:#8a7c70; margin:4px 2px 2px; letter-spacing:0.3px;">${tsLabel}</div>` : ''}
          <canvas class="shap-chart-mini"></canvas>
          <div class="clip-actions" style="flex-wrap:wrap; gap:6px;">
            <button class="classify-good-btn" style="flex:1; min-width:0; ${goodActive}">✓ Good</button>
            <button class="classify-bad-btn" style="flex:1; min-width:0; ${badActive}">✗ Bad</button>
            <label style="display:flex; align-items:center; gap:4px;"><input type="checkbox" ${selected[clip] ? 'checked' : ''} /> 선택</label>
            <button class="secondary del-btn">삭제</button>
          </div>
          ${evBadge}
          <button class="secondary trim-btn" style="width:100%; margin-top:8px;">컷 편집 / 이벤트 지정</button>
        `;

        // mini Shapley 차트 렌더링
        const stats = clip_feature_stats[clip];
        if (stats) {
          const miniCanvas = card.querySelector('.shap-chart-mini');
          requestAnimationFrame(() => drawShapChart(miniCanvas, stats, true));
        }

        async function classifyAs(targetCat) {
          const res = await fetch(`/api/jobs/${job_id}/clips/${clip}/classify?category=${targetCat}`, {method:'POST'});
          if (!res.ok) {
            const err = await res.json().catch(() => ({detail:'분류 실패'}));
            alert(err.detail || '분류 실패');
            return;
          }
          const refreshed = await fetchJob(job_id);
          renderClips(refreshed);
        }
        card.querySelector('.classify-good-btn').onclick = () => classifyAs(cat === 'Good' ? 'clips' : 'Good');
        card.querySelector('.classify-bad-btn').onclick  = () => classifyAs(cat === 'Bad'  ? 'clips' : 'Bad');

        card.querySelector('input[type=checkbox]').onchange = async (e) => {
          await fetch(`/api/jobs/${job_id}/clips/${clip}/select?selected=${e.target.checked}`, {method:'POST'});
          const refreshed = await fetchJob(job_id);
          renderClips(refreshed);
        };
        card.querySelector('.del-btn').onclick = async () => {
          if (!confirm('이 클립을 영구 삭제합니다. 계속?')) return;
          await fetch(`/api/jobs/${job_id}/clips/${clip}`, {method:'DELETE'});
          const refreshed = await fetchJob(job_id); renderClips(refreshed);
        };
        card.querySelector('.trim-btn').onclick = () => {
          currentTrimClip = { jobId: job_id, clip };
          const baseClip = trimmed[clip] ? trimmed[clip].from : clip;
          const stats = clip_feature_stats[baseClip] || clip_feature_stats[clip];
          const shapArea = document.getElementById('shapChartArea');
          const shapCanvas = document.getElementById('shapChartFull');
          if (stats) {
            shapArea.style.display = '';
            requestAnimationFrame(() => drawShapChart(shapCanvas, stats, false));
          } else {
            shapArea.style.display = 'none';
          }
          trimVideo.src = `/api/jobs/${job_id}/clips/${clip}/file`;
          trimModal.classList.add('active');
          trimVideo.onloadedmetadata = () => {
            trimStart = 0; trimEnd = trimVideo.duration;
            updateTrimOverlay(); generateThumbnails();
          };
          refreshEventInfo();
        };
        clipGrid.appendChild(card);
      });
      selectedCountEl.textContent = `선택 ${Object.values(selected).filter(Boolean).length}개`;
      updateOrderPanel(selected, metadata.log_events);
    }

    // --- 편집 UI 컨트롤 ---
    function updateTrimOverlay() {
      const dur = trimVideo.duration || 1;
      trimSelection.style.left = `${(trimStart / dur) * 100}%`;
      trimSelection.style.width = `${((trimEnd - trimStart) / dur) * 100}%`;
      trimHandleStart.style.left = `calc(${(trimStart / dur) * 100}% - 6px)`;
      trimHandleEnd.style.left = `calc(${(trimEnd / dur) * 100}% - 6px)`;
      trimRangeInfo.textContent = `범위: ${trimStart.toFixed(1)}s ~ ${trimEnd.toFixed(1)}s`;
    }

    trimHandleStart.onmousedown = () => draggingHandle = 'start';
    trimHandleEnd.onmousedown = () => draggingHandle = 'end';
    window.onmousemove = (e) => {
      if (!draggingHandle) return;
      const rect = trimTimeline.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const time = pct * trimVideo.duration;
      if (draggingHandle === 'start') trimStart = Math.min(time, trimEnd - 0.1);
      else trimEnd = Math.max(time, trimStart + 0.1);
      updateTrimOverlay();
    };
    window.onmouseup = () => draggingHandle = null;

    trimTimeline.onclick = (e) => {
      if (draggingHandle) return;
      const rect = trimTimeline.getBoundingClientRect();
      trimVideo.currentTime = ((e.clientX - rect.left) / rect.width) * trimVideo.duration;
    };

    trimVideo.ontimeupdate = () => {
      trimPlayhead.style.left = `${(trimVideo.currentTime / trimVideo.duration) * 100}%`;
      trimCurrentTime.textContent = `현재: ${trimVideo.currentTime.toFixed(1)}s`;
      if (loopEnabled && trimVideo.currentTime >= trimEnd) trimVideo.currentTime = trimStart;
    };

    closeTrim.onclick = () => { trimModal.classList.remove('active'); trimVideo.pause(); };
    loopToggle.onclick = () => { loopEnabled = !loopEnabled; loopToggle.textContent = `구간 루프: ${loopEnabled?'ON':'OFF'}`; };
    
    applyTrim.onclick = async () => {
      trimModalInfo.textContent = '적용 중...';
      const res = await fetch(`/api/jobs/${currentTrimClip.jobId}/clips/${currentTrimClip.clip}/trim?start=${trimStart}&end=${trimEnd}`, {method:'POST'});
      if (res.ok) {
        trimModalInfo.textContent = '저장 완료!';
        const refreshed = await fetchJob(currentTrimClip.jobId); renderClips(refreshed);
        setTimeout(() => trimModal.classList.remove('active'), 1000);
      }
    };

    // --- 이벤트 프레임 지정 로직 ---
    async function refreshEventInfo() {
      if (!currentTrimClip) { currentEventInfo.textContent = ''; return; }
      try {
        const res = await fetch(`/api/jobs/${currentTrimClip.jobId}/clips/${currentTrimClip.clip}/event`);
        if (res.ok) {
          const m = await res.json();
          const typeKey = m.event_type || 'unknown';
          const typeLabel = EVENT_TYPE_LABELS[typeKey] || typeKey;
          currentEventInfo.innerHTML = `<strong style="color:#ffd27a;">⚑ 현재 이벤트: 클립 내 ${m.event_time_in_clip_sec.toFixed(2)}s / 원본 frame ${m.event_frame_original} · <span style="text-transform:uppercase;">${typeLabel}</span></strong>`;
          // 드롭다운을 현재 값으로 프리셀렉트
          if (eventTypeSelect && EVENT_TYPES.includes(typeKey)) {
            eventTypeSelect.value = typeKey;
          }
        } else {
          currentEventInfo.textContent = '현재 지정된 이벤트 없음';
          if (eventTypeSelect) eventTypeSelect.value = 'unknown';
        }
      } catch (_) { currentEventInfo.textContent = ''; }
    }

    markEventBtn.onclick = async () => {
      if (!currentTrimClip) return;
      const t = trimVideo.currentTime;
      const fd = new FormData();
      fd.append('event_time_in_clip', String(t));
      fd.append('event_type', eventTypeSelect ? eventTypeSelect.value : 'unknown');
      const res = await fetch(
        `/api/jobs/${currentTrimClip.jobId}/clips/${currentTrimClip.clip}/event`,
        { method: 'POST', body: fd }
      );
      if (!res.ok) {
        const err = await res.json().catch(() => ({detail: '요청 실패'}));
        currentEventInfo.textContent = `실패: ${err.detail || ''}`;
        return;
      }
      const data = await res.json();
      const typeLabel = EVENT_TYPE_LABELS[data.mark.event_type] || data.mark.event_type;
      currentEventInfo.innerHTML = `<strong style="color:#ffd27a;">⚑ 저장됨: 클립 내 ${data.mark.event_time_in_clip_sec.toFixed(2)}s → 원본 frame ${data.mark.event_frame_original} · <span style="text-transform:uppercase;">${typeLabel}</span></strong>`;
      const refreshed = await fetchJob(currentTrimClip.jobId);
      renderClips(refreshed);
    };

    clearEventBtn.onclick = async () => {
      if (!currentTrimClip) return;
      await fetch(
        `/api/jobs/${currentTrimClip.jobId}/clips/${currentTrimClip.clip}/event`,
        { method: 'DELETE' }
      );
      currentEventInfo.textContent = '이벤트 지정 해제됨';
      const refreshed = await fetchJob(currentTrimClip.jobId);
      renderClips(refreshed);
    };

    // --- 공통 로직 ---
    async function fetchJob(jobId) { const res = await fetch(`/api/jobs/${jobId}`); return res.json(); }

    // --- 기존 Run 목록 ---
    const existingJobSelect = document.getElementById('existingJobSelect');
    const loadJobBtn = document.getElementById('loadJobBtn');
    const refreshJobsBtn = document.getElementById('refreshJobsBtn');

    async function loadExistingJobs() {
      try {
        const res = await fetch('/api/jobs');
        const data = await res.json();
        const jobs = data.jobs || [];
        existingJobSelect.innerHTML = '<option value="">(선택)</option>';
        jobs.forEach(j => {
          const dt = j.created_at ? new Date(j.created_at * 1000).toLocaleString() : '-';
          const short = (j.job_id || '').slice(0, 8);
          const src = j.source_filename ? ` · ${j.source_filename}` : '';
          const opt = document.createElement('option');
          opt.value = j.job_id;
          opt.textContent = `${short}  [${j.status}]  clips=${j.clip_count}${src}  · ${dt}`;
          existingJobSelect.appendChild(opt);
        });
      } catch (e) {
        console.error('기존 job 목록 로드 실패', e);
      }
    }

    loadJobBtn.onclick = async () => {
      const jobId = existingJobSelect.value;
      if (!jobId) { alert('불러올 Run 을 선택하세요.'); return; }
      currentJobId = jobId;
      statusEl.textContent = `기존 Run 불러오는 중: ${jobId.slice(0,8)}...`;
      const data = await fetchJob(jobId);
      statusEl.textContent = `${data.status}: ${data.message || ''}`;
      renderClips(data);
      if (data.status === 'done') loadScoreTrend(jobId, data.highlight_frames);
      // 진행중이면 폴링 계속
      if (data.status !== 'done' && data.status !== 'error') startPolling(jobId);
    };

    refreshJobsBtn.onclick = loadExistingJobs;

    // 페이지 로드 시 자동 목록 로드 + URL ?job=xxx 지원
    window.addEventListener('DOMContentLoaded', async () => {
      await loadExistingJobs();
      const params = new URLSearchParams(window.location.search);
      const urlJob = params.get('job');
      if (urlJob) {
        existingJobSelect.value = urlJob;
        loadJobBtn.click();
      }
    });

    uploadBtn.onclick = async () => {
      if (!videoInput.files[0]) { alert('영상을 선택하세요.'); return; }
      const formData = new FormData();
      formData.append('file', videoInput.files[0]);
      formData.append('highlight_count', countInput.value);
      statusEl.textContent = '업로드 중...';
      const res = await fetch('/api/jobs', { method: 'POST', body: formData });
      const data = await res.json();
      currentJobId = data.job_id;
      startPolling(currentJobId);
    };

    // ── 로그 업로드 ───────────────────────────────
    const logUploadBtn  = document.getElementById('logUploadBtn');
    const logResetBtn   = document.getElementById('logResetBtn');
    const logVideoInput = document.getElementById('logVideoInput');
    const logDataInput  = document.getElementById('logDataInput');
    const halfStartMin  = document.getElementById('halfStartMin');
    const halfStartSec  = document.getElementById('halfStartSec');
    const logCountInput = document.getElementById('logCountInput');

    // 파일 선택 시 파일명 표시
    logDataInput.addEventListener('change', () => {
      const f = logDataInput.files[0];
      document.getElementById('logFileInfo').textContent = f ? f.name : '';
    });

    logUploadBtn.onclick = async () => {
      if (!logVideoInput.files[0]) { alert('영상을 선택하세요.'); return; }
      if (!logDataInput.files[0]) { alert('로그 JSON 파일을 선택하세요.'); return; }

      let rawLog;
      try {
        rawLog = await logDataInput.files[0].text();
        JSON.parse(rawLog);
      } catch {
        alert('JSON 파일을 읽을 수 없거나 형식이 잘못됐습니다.');
        return;
      }

      const formData = new FormData();
      formData.append('file', logVideoInput.files[0]);
      formData.append('log_data', rawLog);
      formData.append('second_half_start_min', halfStartMin.value);
      formData.append('second_half_start_sec_extra', halfStartSec.value);
      formData.append('highlight_count', logCountInput.value);
      statusEl.textContent = '로그 업로드 중...';

      const res = await fetch('/api/log-jobs', { method: 'POST', body: formData });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        statusEl.textContent = `오류: ${err.detail || '업로드 실패'}`;
        return;
      }
      const data = await res.json();
      currentJobId = data.job_id;
      startPolling(currentJobId);
    };

    logResetBtn.onclick = () => {
      logVideoInput.value = '';
      logDataInput.value = '';
      document.getElementById('logFileInfo').textContent = '';
      halfStartMin.value = '25';
      halfStartSec.value = '0';
      statusEl.textContent = '대기 중';
      clipGrid.innerHTML = '';
      currentJobId = null;
    };

    function startPolling(jobId) {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        const data = await fetchJob(jobId);
        statusEl.textContent = `${data.status}: ${data.message}`;
        if (data.status === 'done' || data.status === 'error') {
          clearInterval(pollTimer);
          renderClips(data);
          if (data.status === 'done') loadScoreTrend(jobId, data.highlight_frames);
        }
      }, 3000);
    }

    mergeBtn.onclick = async () => {
      if (!currentJobId) return;
      mergeInfo.textContent = '합치는 중...';
      const res = await fetch(`/api/jobs/${currentJobId}/export`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clip_order: clipOrder.length ? clipOrder : null }),
      });
      if (!res.ok) {
        const err = await res.json();
        mergeInfo.textContent = err.detail || '합치기 실패';
        return;
      }
      const data = await res.json();
      mergeInfo.innerHTML = `합쳐진 영상: <a href="/runs/${currentJobId}/${data.merged}" target="_blank">다운로드</a>`;
    };

    exportBtn.onclick = async () => {
      if (!currentJobId) return;
      exportInfo.textContent = '저장 중...';
      const res = await fetch(`/api/jobs/${currentJobId}/export/selected`, { method: 'POST' });
      if (!res.ok) {
        const err = await res.json();
        exportInfo.textContent = err.detail || '저장 실패';
        return;
      }
      const data = await res.json();
      exportInfo.textContent = `저장 완료: ${data.exported.length}개`;
    };

    resetBtn.onclick = () => location.reload();

    // ── 이벤트 태깅 탭 ────────────────────────────────
    const tagJobSelect   = document.getElementById('tagJobSelect');
    const tagLoadBtn     = document.getElementById('tagLoadBtn');
    const tagVideo       = document.getElementById('tagVideo');
    const tagCurrentTime = document.getElementById('tagCurrentTime');
    const tagFrameInfo   = document.getElementById('tagFrameInfo');
    const tagEventType   = document.getElementById('tagEventType');
    const tagMarkBtn     = document.getElementById('tagMarkBtn');
    const tagMarkList    = document.getElementById('tagMarkList');
    const tagMarkListWrap= document.getElementById('tagMarkListWrap');
    const tagMarkCount   = document.getElementById('tagMarkCount');
    const tagVideoInfo   = document.getElementById('tagVideoInfo');
    let tagJobId = null;
    let tagFps   = 30.0;

    function fmtTagTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const tenths = Math.floor((sec % 1) * 10);
      return `${m}:${String(s).padStart(2,'0')}.${tenths}`;
    }

    // 이벤트 타입 셀렉트 채우기
    function populateTagEventTypes() {
      tagEventType.innerHTML = EVENT_TYPES
        .filter(t => t !== 'unknown')
        .concat(['unknown'])
        .map(t => `<option value="${t}">${EVENT_TYPE_LABELS[t] || t}</option>`)
        .join('');
      tagEventType.value = 'goal';
    }
    populateTagEventTypes();

    async function loadTagJobs() {
      try {
        const res  = await fetch('/api/jobs');
        const data = await res.json();
        tagJobSelect.innerHTML = '<option value="">(영상 선택)</option>';
        (data.jobs || []).filter(j => j.status === 'done').forEach(j => {
          const src  = j.source_filename ? ` · ${j.source_filename}` : '';
          const dt   = j.created_at ? new Date(j.created_at * 1000).toLocaleString('ko') : '';
          const opt  = document.createElement('option');
          opt.value  = j.job_id;
          opt.textContent = `${j.job_id.slice(0,8)}${src} · ${dt}`;
          tagJobSelect.appendChild(opt);
        });
      } catch(e) { console.error('태그 탭 job 목록 실패', e); }
    }

    tagLoadBtn.onclick = async () => {
      const jobId = tagJobSelect.value;
      if (!jobId) { alert('영상을 선택하세요.'); return; }
      tagJobId = jobId;
      const meta = await fetchJob(jobId);
      tagFps = parseFloat(meta.fps || 30.0);
      tagVideoInfo.textContent = meta.source_filename || '';
      tagVideo.src = `/api/jobs/${jobId}/video`;
      tagVideo.style.display = '';
      tagMarkBtn.disabled = false;
      await renderTagMarkList();
    };

    tagVideo.ontimeupdate = () => {
      const t = tagVideo.currentTime;
      tagCurrentTime.textContent = fmtTagTime(t);
      tagFrameInfo.textContent   = `frame ${Math.round(t * tagFps)}  ·  fps ${tagFps.toFixed(1)}`;
    };

    // 키보드 단축키: 이벤트 태깅 탭에서 ← → 로 1초 이동, Shift+←→ 로 0.1초 이동
    document.addEventListener('keydown', e => {
      if (document.getElementById('panelTag').style.display === 'none') return;
      if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT') return;
      if (e.key === 'ArrowRight') { tagVideo.currentTime += e.shiftKey ? 0.1 : 1; e.preventDefault(); }
      if (e.key === 'ArrowLeft')  { tagVideo.currentTime -= e.shiftKey ? 0.1 : 1; e.preventDefault(); }
      if (e.key === ' ') { tagVideo.paused ? tagVideo.play() : tagVideo.pause(); e.preventDefault(); }
    });

    tagMarkBtn.onclick = async () => {
      if (!tagJobId) return;
      const res = await fetch(`/api/jobs/${tagJobId}/marks`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ video_sec: tagVideo.currentTime, event_type: tagEventType.value }),
      });
      if (!res.ok) { alert((await res.json().catch(()=>({}))).detail || '태그 저장 실패'); return; }
      await renderTagMarkList();
    };

    async function renderTagMarkList() {
      if (!tagJobId) return;
      const res  = await fetch(`/api/jobs/${tagJobId}/marks`);
      const data = await res.json();
      const marks = data.marks || {};
      const sorted = Object.entries(marks).sort((a,b) => a[1].video_sec - b[1].video_sec);

      tagMarkCount.textContent   = `${sorted.length}개`;
      tagMarkListWrap.style.display = sorted.length ? '' : 'none';
      tagMarkList.innerHTML = '';

      sorted.forEach(([key, mark]) => {
        const timeStr  = fmtTagTime(mark.video_sec);
        const typeLabel = EVENT_TYPE_LABELS[mark.event_type] || mark.event_type;

        const item = document.createElement('div');
        item.style.cssText = 'display:flex; align-items:center; gap:10px; background:rgba(26,19,15,0.95); border:1px solid rgba(255,116,0,0.15); border-radius:8px; padding:8px 14px; cursor:pointer;';
        item.innerHTML = `
          <span style="font-size:17px; font-weight:700; color:#ff8a1d; min-width:64px; font-variant-numeric:tabular-nums;">${timeStr}</span>
          <span style="flex:1; font-size:13px;">${typeLabel}</span>
          <span style="font-size:11px; color:#8a7c70; white-space:nowrap;">frame ${mark.event_frame_original}</span>
          <button class="secondary" style="padding:3px 10px; font-size:12px;" data-key="${key}">삭제</button>
        `;
        // 클릭 → 해당 시각으로 이동
        item.addEventListener('click', e => {
          if (e.target.tagName === 'BUTTON') return;
          tagVideo.currentTime = mark.video_sec;
          tagVideo.pause();
        });
        item.querySelector('button').onclick = async e => {
          e.stopPropagation();
          await fetch(`/api/jobs/${tagJobId}/marks/${encodeURIComponent(key)}`, { method: 'DELETE' });
          await renderTagMarkList();
        };
        tagMarkList.appendChild(item);
      });
    }
  </script>
</body>
</html>
